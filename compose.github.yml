services:
  postgres:
    image: ghcr.io/jasakuva/hamqtt-postgres-pgbackrest:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  migrate:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  web:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  updater:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}
    command: ["gunicorn", "--bind", "0.0.0.0:8100", "--workers", "1", "hamqtt_store.updater_server:app"]

  mqtt-ingestor:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  ha-ingestor:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  mcp:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  cleanup:
    image: ghcr.io/jasakuva/hamqtt-store:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  backup:
    image: ghcr.io/jasakuva/hamqtt-backup-pgbackrest:${HAMQTT_VERSION:?Set HAMQTT_VERSION}

  recovery:
    image: ghcr.io/jasakuva/hamqtt-backup-pgbackrest:${HAMQTT_VERSION:?Set HAMQTT_VERSION}