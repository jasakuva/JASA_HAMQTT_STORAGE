[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamqtt-store"
version = "0.1.0"
description = "Home Assistant and MQTT data store with PostgreSQL and pgvector"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "paho-mqtt>=2.1,<3",
  "websocket-client>=1.8,<2",
  "python-dotenv>=1.1,<2",
  "cryptography>=44,<46",
  "gunicorn>=23,<27",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
