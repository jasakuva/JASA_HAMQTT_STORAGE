{% extends "base.html" %}{% block topbar_title %}CSV export{% endblock %}{% block content %}
<div class="page-header"><div><h1>Export datasets</h1><p>Download timestamped Home Assistant states and MQTT values as a CSV file.</p></div></div>
<form class="selection-card" method="get"><div class="form-grid"><label>From <input type="datetime-local" name="from" value="{{ start.strftime('%Y-%m-%dT%H:%M') if start else '' }}"></label><label>To <input type="datetime-local" name="to" value="{{ end.strftime('%Y-%m-%dT%H:%M') if end else '' }}"></label></div><label>Datasets <select name="object_id" multiple size="10" required>{% for item in catalog %}<option value="{{ item.id }}" {% if item.id in selected %}selected{% endif %}>{{ item.source }} · {{ item.label }}{% if item.unit %} ({{ item.unit }}){% endif %}</option>{% endfor %}</select></label>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<button class="button" name="download" value="1" type="submit">Download CSV</button></form>
{% endblock %}
