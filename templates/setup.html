{% extends "base.html" %}{% block topbar_title %}Initial setup{% endblock %}{% block content %}
<section class="panel" style="max-width:520px;margin:48px auto"><div class="panel-header"><div><h1 class="panel-title">Create administrator account</h1><p class="panel-subtitle">This is required the first time HA MQTT Store starts.</p></div></div>
{% if error %}<p class="badge warning">{{ error }}</p>{% endif %}
<form method="post" class="settings-form settings-form-labeled"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="username">Username</label><input id="username" name="username" required autofocus></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required><small>Use at least 6 characters. No complicated password rules.</small></div><div class="field"><label for="password_confirmation">Confirm password</label><input id="password_confirmation" name="password_confirmation" type="password" minlength="6" required></div><button>Create account</button></form></section>
{% endblock %}
