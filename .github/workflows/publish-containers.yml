name: Publish container images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish, for example 0.3.3-rc1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hamqtt-store
            dockerfile: build/Dockerfile
          - image: hamqtt-postgres-pgbackrest
            dockerfile: build/PostgresBackupDockerfile
          - image: hamqtt-backup-pgbackrest
            dockerfile: build/BackupDockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select image version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${REQUESTED_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jasakuva/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.value }}
            IMAGE_REVISION=${{ github.sha }}
