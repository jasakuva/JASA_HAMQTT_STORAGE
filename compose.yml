services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg17-bookworm}
    container_name: ${POSTGRES_CONTAINER_NAME:-hamqtt-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamqtt_store}
      POSTGRES_USER: ${POSTGRES_USER:-hamqtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Bind to all host interfaces so Linux host tools and trusted LAN
      # clients can connect; restrict this with POSTGRES_BIND_IP if needed.
      - "${POSTGRES_BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_VOLUME:-hamqtt-postgres-data}:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hamqtt-store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      com.hamqtt.product: "hamqtt-store"
      com.hamqtt.service: "postgres"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/hamqtt-store:dev
    container_name: hamqtt-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://hamqtt:${POSTGRES_PASSWORD:-hamqtt-local-development-password}@hamqtt-postgres:5432/${POSTGRES_DB:-hamqtt_store}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hamqtt-store
    command: ["python", "-m", "alembic", "upgrade", "head"]
    labels:
      com.hamqtt.product: "hamqtt-store"
      com.hamqtt.service: "migrate"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/hamqtt-store:dev
    container_name: hamqtt-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://hamqtt:${POSTGRES_PASSWORD:-hamqtt-local-development-password}@hamqtt-postgres:5432/${POSTGRES_DB:-hamqtt_store}
      SECRET_KEY: ${SECRET_KEY:-change-this-development-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - hamqtt-store
    labels:
      com.hamqtt.product: "hamqtt-store"
      com.hamqtt.service: "web"
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "hamqtt_store.wsgi:app"]

  mqtt-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/hamqtt-store:dev
    container_name: hamqtt-mqtt-ingestor
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://hamqtt:${POSTGRES_PASSWORD:-hamqtt-local-development-password}@hamqtt-postgres:5432/${POSTGRES_DB:-hamqtt_store}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - hamqtt-store
    labels:
      com.hamqtt.product: "hamqtt-store"
      com.hamqtt.service: "mqtt-ingestor"
    command: ["python", "-m", "hamqtt_store.cli", "mqtt"]

  ha-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/hamqtt-store:dev
    container_name: hamqtt-ha-ingestor
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://hamqtt:${POSTGRES_PASSWORD:-hamqtt-local-development-password}@hamqtt-postgres:5432/${POSTGRES_DB:-hamqtt_store}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - hamqtt-store
    labels:
      com.hamqtt.product: "hamqtt-store"
      com.hamqtt.service: "ha-ingestor"
    command: ["python", "-m", "hamqtt_store.cli", "ha"]

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/hamqtt-store:dev
    container_name: hamqtt-mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://hamqtt:${POSTGRES_PASSWORD:-hamqtt-local-development-password}@hamqtt-postgres:5432/${POSTGRES_DB:-hamqtt_store}
      MCP_TRANSPORT: streamable-http
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${MCP_PORT:-8001}:8000"
    networks:
      - hamqtt-store
    labels:
      com.hamqtt.product: "hamqtt-store"
      com.hamqtt.service: "mcp"
    command: ["python", "-m", "hamqtt_store.cli", "mcp"]

networks:
  hamqtt-store:
    name: ${POSTGRES_NETWORK:-hamqtt-store-network}
    # This network can outlive Compose project recreation and is reused by
    # the fixed-name HAMQTT containers during upgrades.
    external: true

volumes:
  hamqtt-postgres-data:
    name: ${POSTGRES_VOLUME:-hamqtt-postgres-data}
    # Never remove this volume during an application update; it contains the
    # PostgreSQL database shared by all HAMQTT services.
    external: true
